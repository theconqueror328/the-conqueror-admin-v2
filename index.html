<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE ⚔ CONQUEROR | Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #070707;
  color: white;
}

/* =========================
   LOGIN
========================= */

#loginPage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;

  background:
    radial-gradient(
      circle,
      #4d1708 0%,
      #120806 45%,
      #070707 80%
    );
}

.login-box {
  width: 100%;
  max-width: 420px;
  padding: 30px;

  background: #101010;
  border: 1px solid #292929;
  border-radius: 15px;
}

.login-logo {
  text-align: center;
  margin-bottom: 25px;
}

.login-logo h1 {
  margin: 0;
  color: #ff5b22;
  font-size: 25px;
}

.login-logo p {
  color: #888;
}

label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}

input {
  width: 100%;
  margin-top: 8px;
  padding: 14px;

  background: #070707;
  color: white;

  border: 1px solid #333;
  border-radius: 8px;
  outline: none;
}

input:focus {
  border-color: #ff541c;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 8px;
  font-weight: bold;
}

.login-button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;

  background: #ff541c;
  color: white;
}

.login-error {
  display: none;

  margin-top: 15px;
  padding: 12px;

  border-radius: 8px;

  background: #3a0b0b;
  color: #ff7777;
}


/* =========================
   DASHBOARD
========================= */

#dashboard {
  display: none;
}

header {
  padding: 20px;

  background: #101010;
  border-bottom: 1px solid #292929;
}

.header-inner {
  width: 94%;
  max-width: 1200px;

  margin: auto;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  color: #ff5b22;
}

header p {
  margin: 5px 0 0;
  color: #888;
}

.logout {
  padding: 11px 16px;

  background: #333;
  color: white;
}

.container {
  width: 94%;
  max-width: 1200px;

  margin: auto;
  padding: 30px 0;
}

#error {
  display: none;

  padding: 15px;
  margin-bottom: 20px;

  border-radius: 8px;

  background: #3a0b0b;
  color: #ff7777;
}


/* =========================
   STATS
========================= */

.stats {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 15px;

  margin-bottom: 25px;
}

.stat {
  padding: 20px;

  background: #101010;

  border: 1px solid #292929;
  border-radius: 12px;
}

.stat-title {
  color: #888;
  font-size: 12px;
}

.stat-number {
  margin-top: 8px;

  font-size: 30px;
  font-weight: bold;

  color: #ff652c;
}


/* =========================
   SEARCH
========================= */

.toolbar {
  display: flex;
  gap: 10px;

  margin-bottom: 20px;
}

.search {
  flex: 1;
}

.refresh {
  padding: 12px 18px;

  background: #ff541c;
  color: white;
}


/* =========================
   TABLE
========================= */

.table-wrapper {
  overflow-x: auto;

  background: #101010;

  border: 1px solid #292929;
  border-radius: 12px;
}

table {
  width: 100%;
  min-width: 800px;

  border-collapse: collapse;
}

th,
td {
  padding: 15px;

  text-align: left;

  border-bottom: 1px solid #242424;
}

th {
  color: #ff652c;
}


/* STATUS */

.status {
  padding: 5px 9px;

  border-radius: 20px;

  font-size: 11px;
  font-weight: bold;
}

.pending {
  background: #4a3200;
  color: #ffcc55;
}

.approved {
  background: #063b1b;
  color: #52e38b;
}

.rejected {
  background: #430909;
  color: #ff6969;
}


/* =========================
   ACTION BUTTONS
========================= */

.action {
  padding: 7px 10px;
  margin-right: 4px;

  color: white;
}

.view {
  background: #444;
}

.approve {
  background: #087f3d;
}

.reject {
  background: #a71919;
}


/* =========================
   MODAL
========================= */

#applicationModal {
  display: none;

  position: fixed;
  inset: 0;

  background: rgba(0,0,0,.88);

  z-index: 1000;

  padding: 20px;

  overflow-y: auto;
}

.modal-box {
  width: 100%;
  max-width: 760px;

  margin: 30px auto;

  background: #101010;

  border: 1px solid #333;

  border-radius: 15px;

  overflow: hidden;
}

.modal-header {
  padding: 20px;

  background:
    linear-gradient(
      135deg,
      #351006,
      #101010
    );

  border-bottom: 1px solid #292929;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h2 {
  margin: 0;
  color: #ff652c;
}

.close-button {
  background: #333;
  color: white;

  padding: 9px 13px;
}

.modal-content {
  padding: 25px;
}

.detail {
  padding: 15px 0;

  border-bottom: 1px solid #252525;
}

.detail:last-child {
  border-bottom: none;
}

.detail-label {
  color: #888;

  font-size: 12px;

  margin-bottom: 5px;

  text-transform: uppercase;
}

.detail-value {
  color: white;

  font-size: 16px;

  word-break: break-word;
}

.detail-reason {
  white-space: pre-wrap;

  line-height: 1.6;
}


/* =========================
   SCREENSHOT SECTION
========================= */

.screenshot-box {
  margin: 25px 0;
  padding: 18px;

  background: #080808;

  border: 1px solid #292929;

  border-radius: 12px;
}

.screenshot-title {
  margin-bottom: 15px;

  color: #ff652c;

  font-size: 17px;
  font-weight: bold;
}

.screenshot-link-box {
  padding: 12px;

  background: #111;

  border: 1px solid #333;

  border-radius: 8px;

  word-break: break-all;
}

.screenshot-link {
  color: #ff8a5c;

  text-decoration: underline;

  font-size: 14px;
}

.screenshot-buttons {
  display: flex;

  gap: 10px;

  margin-top: 15px;
}

.open-image {
  flex: 1;

  padding: 12px;

  background: #ff541c;

  color: white;
}

.copy-link {
  flex: 1;

  padding: 12px;

  background: #333;

  color: white;
}

.profile-image {
  display: block;

  width: 100%;

  max-width: 500px;

  max-height: 600px;

  object-fit: contain;

  margin: 20px auto 0;

  border-radius: 10px;

  border: 1px solid #333;

  background: #000;
}

.image-error {
  color: #ff7777;

  padding: 20px;

  text-align: center;
}


/* =========================
   MODAL ACTIONS
========================= */

.modal-actions {
  display: flex;

  gap: 10px;

  padding: 20px 25px;

  border-top: 1px solid #292929;
}

.modal-actions button {
  flex: 1;

  padding: 13px;

  color: white;
}

.modal-approve {
  background: #087f3d;
}

.modal-reject {
  background: #a71919;
}


/* =========================
   LOADING
========================= */

.loading {
  text-align: center;

  color: #888;

  padding: 30px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .toolbar {
    flex-direction: column;
  }

  .header-inner {
    gap: 15px;
  }

  .modal-actions {
    flex-direction: column;
  }

  .modal-content {
    padding: 18px;
  }

  .screenshot-buttons {
    flex-direction: column;
  }

}

</style>

</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<section id="loginPage">

<div class="login-box">

<div class="login-logo">

<h1>
THE ⚔ CONQUEROR
</h1>

<p>
Admin Dashboard
</p>

</div>


<form id="loginForm">

<label>

Admin Email

<input
type="email"
id="email"
placeholder="Enter admin email"
required
>

</label>


<label>

Password

<input
type="password"
id="password"
placeholder="Enter password"
required
>

</label>


<button
type="submit"
class="login-button"
id="loginButton"
>

🔐 LOGIN

</button>


<div
id="loginError"
class="login-error"
></div>

</form>

</div>

</section>



<!-- =========================
     DASHBOARD
========================= -->

<section id="dashboard">

<header>

<div class="header-inner">

<div>

<h1>
THE ⚔ CONQUEROR
</h1>

<p>
Guild Recruitment Admin Dashboard
</p>

</div>


<button
class="logout"
id="logoutButton"
>

LOGOUT

</button>

</div>

</header>



<div class="container">

<div id="error"></div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="stat-title">
TOTAL APPLICATIONS
</div>

<div
class="stat-number"
id="total"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
PENDING
</div>

<div
class="stat-number"
id="pending"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
APPROVED
</div>

<div
class="stat-number"
id="approved"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
REJECTED
</div>

<div
class="stat-number"
id="rejected"
>
0
</div>

</div>

</div>



<!-- SEARCH -->

<div class="toolbar">

<input
class="search"
id="search"
type="text"
placeholder="Search by IGN or UID..."
>


<button
class="refresh"
id="refreshButton"
>

🔄 REFRESH

</button>

</div>



<!-- TABLE -->

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>IGN</th>

<th>UID</th>

<th>ROLE</th>

<th>RANK</th>

<th>STATUS</th>

<th>ACTION</th>

</tr>

</thead>


<tbody id="applications">

<tr>

<td
colspan="6"
class="loading"
>

Loading applications...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</section>



<!-- =========================
     APPLICATION MODAL
========================= -->

<div
id="applicationModal"
>

<div class="modal-box">


<div class="modal-header">

<h2>
⚔ APPLICATION DETAILS
</h2>

<button
class="close-button"
onclick="closeApplication()"
>

✕

</button>

</div>


<div
class="modal-content"
id="applicationDetails"
>

</div>


<div
class="modal-actions"
id="modalActions"
>

</div>


</div>

</div>



<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://muyggfhblazjqoewrxth.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_M_7Cb2GtvzQqLftmUJE_1Q_fXB1e3Ma";


/* =========================
   VARIABLES
========================= */

let accessToken = null;

let allApplications = [];

let selectedApplication = null;


/* =========================
   ELEMENTS
========================= */

const loginPage =
document.getElementById("loginPage");

const dashboard =
document.getElementById("dashboard");

const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const loginError =
document.getElementById("loginError");

const applicationsTable =
document.getElementById("applications");

const errorBox =
document.getElementById("error");

const applicationModal =
document.getElementById("applicationModal");

const applicationDetails =
document.getElementById("applicationDetails");

const modalActions =
document.getElementById("modalActions");


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
"submit",
async function(event) {

event.preventDefault();

loginError.style.display = "none";

loginButton.disabled = true;

loginButton.textContent =
"LOGGING IN...";


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


try {

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/token?grant_type=password",

{

method: "POST",

headers: {

"apikey":
SUPABASE_ANON_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

email: email,

password: password

})

}

);


const result =
await response.json();


if (!response.ok) {

throw new Error(

result.error_description ||

result.msg ||

result.message ||

"Login failed."

);

}


accessToken =
result.access_token;


localStorage.setItem(

"tc_admin_access_token",

accessToken

);


showDashboard();

}


catch(error) {

console.error(error);

loginError.textContent =
error.message;

loginError.style.display =
"block";

loginButton.disabled =
false;

loginButton.textContent =
"🔐 LOGIN";

}

});


/* =========================
   SHOW DASHBOARD
========================= */

function showDashboard() {

loginPage.style.display =
"none";

dashboard.style.display =
"block";

loadApplications();

}


/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutButton")
.addEventListener(
"click",
function() {

accessToken = null;

localStorage.removeItem(
"tc_admin_access_token"
);

dashboard.style.display =
"none";

loginPage.style.display =
"flex";

loginForm.reset();

}
);


/* =========================
   LOAD APPLICATIONS
========================= */

async function loadApplications() {

errorBox.style.display =
"none";


applicationsTable.innerHTML = `

<tr>

<td
colspan="6"
class="loading"
>

Loading applications...

</td>

</tr>

`;


try {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/applications?select=*&order=created_at.desc",

{

method: "GET",

headers: {

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " +
accessToken

}

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(text);

}


allApplications =
JSON.parse(text);


updateStats();


displayApplications(
allApplications
);

}


catch(error) {

console.error(error);

errorBox.textContent =
"Could not load applications: " +
error.message;

errorBox.style.display =
"block";

}

}


/* =========================
   STATS
========================= */

function updateStats() {

document.getElementById("total")
.textContent =
allApplications.length;


document.getElementById("pending")
.textContent =
allApplications.filter(
app => app.status === "pending"
).length;


document.getElementById("approved")
.textContent =
allApplications.filter(
app => app.status === "approved"
).length;


document.getElementById("rejected")
.textContent =
allApplications.filter(
app => app.status === "rejected"
).length;

}


/* =========================
   DISPLAY TABLE
========================= */

function displayApplications(
applications
) {

if (!applications.length) {

applicationsTable.innerHTML = `

<tr>

<td
colspan="6"
class="loading"
>

No applications found.

</td>

</tr>

`;

return;

}


applicationsTable.innerHTML =

applications.map(
app => `

<tr>

<td>
${safe(app.ign)}
</td>

<td>
${safe(app.uid)}
</td>

<td>
${safe(app.player_role)}
</td>

<td>
${safe(app.player_rank)}
</td>

<td>

<span
class="status ${safe(app.status)}"
>

${safe(app.status).toUpperCase()}

</span>

</td>

<td>

<button
class="action view"
onclick="viewApplication('${safe(app.application_id)}')"
>

👁 VIEW

</button>


${
app.status === "pending"

? `

<button
class="action approve"
onclick="updateStatus(
'${safe(app.application_id)}',
'approved'
)"
>

✓

</button>


<button
class="action reject"
onclick="updateStatus(
'${safe(app.application_id)}',
'rejected'
)"
>

✕

</button>

`

: ""

}

</td>

</tr>

`
)
.join("");

}


/* =========================
   VIEW APPLICATION
========================= */

function viewApplication(
applicationId
) {

selectedApplication =
allApplications.find(

app =>
String(app.application_id) ===
String(applicationId)

);


if (!selectedApplication) {

alert(
"Application could not be found."
);

return;

}


const app =
selectedApplication;


/* =========================
   SCREENSHOT
========================= */

let screenshotHTML = "";


if (
app.profile_screenshot_url &&
String(app.profile_screenshot_url).trim() !== ""
) {

const screenshotURL =
String(
app.profile_screenshot_url
).trim();


screenshotHTML = `

<div class="screenshot-box">

<div class="screenshot-title">

📸 FREE FIRE PROFILE SCREENSHOT

</div>


<div class="screenshot-link-box">

<a
href="${safe(screenshotURL)}"
target="_blank"
rel="noopener noreferrer"
class="screenshot-link"
>

${safe(screenshotURL)}

</a>

</div>


<div class="screenshot-buttons">

<button
class="open-image"
onclick="openScreenshot()"
>

🖼️ VIEW IMAGE

</button>


<button
class="copy-link"
onclick="copyScreenshotLink()"
>

📋 COPY LINK

</button>

</div>


<img
src="${safe(screenshotURL)}"
class="profile-image"
alt="Free Fire profile screenshot"

onerror="
this.style.display='none';
document.getElementById('imageLoadError').style.display='block';
"
>


<div
id="imageLoadError"
class="image-error"
style="display:none;"
>

⚠️ The image could not be displayed here.

The link above is still available.

</div>


</div>

`;

}

else {

screenshotHTML = `

<div class="screenshot-box">

<div class="screenshot-title">

📸 FREE FIRE PROFILE SCREENSHOT

</div>


<div class="image-error">

No profile screenshot link was saved
for this application.

</div>

</div>

`;

}


/* =========================
   APPLICATION DETAILS
========================= */

applicationDetails.innerHTML = `

<div
class="modal-status ${safe(app.status)}"
>

STATUS:
${safe(app.status).toUpperCase()}

</div>


${detail(
"Application ID",
app.application_id
)}


${detail(
"In-Game Name",
app.ign
)}


${detail(
"Free Fire UID",
app.uid
)}


${detail(
"Game Level",
app.game_level
)}


${detail(
"Prime Level",
app.prime_level
)}


${detail(
"Gender",
app.gender
)}


${detail(
"WhatsApp / Contact",
app.contact
)}


${detail(
"Main Role",
app.player_role
)}


${detail(
"Current Rank",
app.player_rank
)}


${detail(
"Headshot %",
app.headshot
)}


${detail(
"Game Mode",
app.game_mode
)}


${detail(
"Microphone",
app.microphone
)}


${detail(
"Previous Guild / Team",
app.previous_guild
)}


${screenshotHTML}


<div class="detail">

<div class="detail-label">

WHY DO YOU WANT TO JOIN
THE ⚔ CONQUEROR?

</div>


<div class="detail-value detail-reason">

${safe(
app.reason ||
"No reason provided."
)}

</div>

</div>


${detail(
"Submitted",
app.created_at
?
new Date(
app.created_at
).toLocaleString()
:
"Unknown"
)}

`;


/* =========================
   MODAL ACTIONS
========================= */

if (
app.status === "pending"
) {

modalActions.innerHTML = `

<button
class="modal-approve"
onclick="updateStatus(
'${safe(app.application_id)}',
'approved'
)"
>

✓ APPROVE APPLICATION

</button>


<button
class="modal-reject"
onclick="updateStatus(
'${safe(app.application_id)}',
'rejected'
)"
>

✕ REJECT APPLICATION

</button>

`;

}

else {

modalActions.innerHTML = `

<button
class="close-button"
onclick="closeApplication()"
>

CLOSE

</button>

`;

}


applicationModal.style.display =
"block";

document.body.style.overflow =
"hidden";

}


/* =========================
   OPEN SCREENSHOT
========================= */

function openScreenshot() {

if (
selectedApplication &&
selectedApplication.profile_screenshot_url
) {

window.open(
selectedApplication.profile_screenshot_url,
"_blank"
);

}

}


/* =========================
   COPY SCREENSHOT LINK
========================= */

async function copyScreenshotLink() {

if (
!selectedApplication ||
!selectedApplication.profile_screenshot_url
) {

return;

}


try {

await navigator.clipboard.writeText(

selectedApplication.profile_screenshot_url

);

alert(
"Screenshot link copied!"
);

}

catch(error) {

alert(
"Could not copy the screenshot link."
);

}

}


/* =========================
   DETAIL HELPER
========================= */

function detail(
label,
value
) {

return `

<div class="detail">

<div class="detail-label">

${safe(label)}

</div>


<div class="detail-value">

${
value !== null &&
value !== undefined &&
value !== ""

? safe(value)

: "Not provided"
}

</div>

</div>

`;

}


/* =========================
   CLOSE MODAL
========================= */

function closeApplication() {

applicationModal.style.display =
"none";

document.body.style.overflow =
"";

selectedApplication =
null;

}


/* =========================
   SEARCH
========================= */

document
.getElementById("search")
.addEventListener(
"input",
function() {

const term =
this.value
.toLowerCase()
.trim();


const filtered =
allApplications.filter(
app =>

String(app.ign || "")
.toLowerCase()
.includes(term)

||

String(app.uid || "")
.toLowerCase()
.includes(term)

||

String(app.application_id || "")
.toLowerCase()
.includes(term)

);


displayApplications(
filtered
);

}
);


/* =========================
   REFRESH
========================= */

document
.getElementById("refreshButton")
.addEventListener(
"click",
loadApplications
);


/* =========================
   APPROVE / REJECT
========================= */

async function updateStatus(
applicationId,
newStatus
) {

const action =
newStatus === "approved"
? "approve"
: "reject";


if (
!confirm(
"Are you sure you want to " +
action +
" this application?"
)
) {

return;

}


try {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/applications" +
"?application_id=eq." +
encodeURIComponent(
applicationId
),

{

method: "PATCH",

headers: {

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " +
accessToken,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:
JSON.stringify({

status:
newStatus

})

}

);


const text =
await response.text();


if (!response.ok) {

throw new Error(text);

}


closeApplication();


await loadApplications();

}


catch(error) {

alert(
"Could not update application:\n\n" +
error.message
);

}

}


/* =========================
   SAFE TEXT
========================= */

function safe(value) {

if (
value === null ||
value === undefined
) {

return "";

}


return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* =========================
   CHECK SESSION
========================= */

async function checkSession() {

const savedToken =
localStorage.getItem(
"tc_admin_access_token"
);


if (!savedToken) {

return;

}


accessToken =
savedToken;


try {

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method: "GET",

headers: {

"apikey":
SUPABASE_ANON_KEY,

"Authorization":
"Bearer " +
accessToken

}

}

);


if (!response.ok) {

throw new Error(
"Session expired."
);

}


showDashboard();

}


catch(error) {

accessToken =
null;

localStorage.removeItem(
"tc_admin_access_token"
);

}

}


/* =========================
   CLOSE MODAL OUTSIDE
========================= */

applicationModal.addEventListener(
"click",
function(event) {

if (
event.target ===
applicationModal
) {

closeApplication();

}

});


/* =========================
   START
========================= */

checkSession();

</script>
